[project]
name = "mindchat"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14,<3.15"

dependencies = [
    "google-genai==3.0.0",
    "mistralai==3.7.0",
    "openai==3.46.0",
    "pydantic==2.14.3",
    "streamlit==1.67.0",
]

[dependency-groups]
dev = [
    "ollama==0.6.3",
    "pyright==1.1.414",
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "ruff==0.17.4",
    "tomli-w==1.2.0",
    "vulture==2.16.0",
    "watchdog==7.1.0",
]

[tool.pytest.ini_options]
pythonpath = "src"
testpaths = ["tests"]

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if __name__ == \"__main__\":"]

[tool.uv]
add-bounds = "exact"
required-version = "~=0.13.6"
exclude-newer = "7 days"
# security fix GHSA-9m75-vc3g-4x39 et al. (pyasn1 0.6.5)
# TODO: remove after 07.11.26
# watchdog 7.0.0: first release with cp314 macOS wheels
exclude-newer-package = { pyasn1 = false, watchdog = false }

[tool.pyright]
include = ["src"]

[tool.vulture]
paths = ["src"]
# exclude = ["src/models.py"]
ignore_names = []
