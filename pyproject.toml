[project]
name = "mindchat"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14,<3.15"

dependencies = [
    "google-genai>=2.34.0",
    "mistralai>=3.6.0",
    "openai>=3.42.0",
    "pydantic>=2.14.2",
    "streamlit>=1.66.1",
]

[dependency-groups]
dev = [
    "ollama>=0.6.3",
    "pyright>=1.1.411",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
    "tomli-w>=1.2.0",
    "watchdog>=6.0.0",
]

[tool.pytest.ini_options]
pythonpath = "src"
testpaths = ["tests"]

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if __name__ == \"__main__\":"]

[tool.uv]
required-version = "~=0.13.6"
exclude-newer = "7 days"

# pyarrow cannot be updated beyond 20.0.0 (pinned by pandas==2.2.3 compatibility)
[tool.uv.audit]
# cspell:disable
ignore = ["GHSA-rgxp-2hwp-jwgg"]
# cspell:enable

[tool.pyright]
include = ["src"]

[tool.vulture]
paths = ["src"]
# exclude = ["src/models.py"]
ignore_names = []
