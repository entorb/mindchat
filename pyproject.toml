[project]
name = "mindchat"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14,<3.15"

dependencies = [
    "google-genai>=2.33.0",
    "mistralai>=3.4.0",
    "openai>=3.37.0",
    "pydantic>=2.14.1",
    "streamlit>=1.66.1",
]

[dependency-groups]
dev = [
    "ollama>=0.6.3",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.2",
    "tomli-w>=1.2.0",
    "watchdog>=6.0.0",
]

[tool.pytest.ini_options]
pythonpath = "src"
testpaths = ["tests"]

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if __name__ == \"__main__\":"]

[tool.uv]
required-version = "~=0.13.6"
exclude-newer = "7 days"
# security fix GHSA-9m75-vc3g-4x39 et al. (pyasn1 0.6.5)
# TODO: remove after 07.11.26
exclude-newer-package = { pyasn1 = false }

[tool.pyright]
include = ["src"]

[tool.vulture]
paths = ["src"]
# exclude = ["src/models.py"]
ignore_names = []
